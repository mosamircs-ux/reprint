apply plugin: 'com.android.application'

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.mosamircs.biopulse'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId project.findProperty('APP_ID') ?: 'com.mosamircs.biopulse'
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(project.findProperty('VERSION_CODE') ?: '1')
        versionName project.findProperty('VERSION_NAME') ?: '1.0.0'
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [
                    admobAppId: 'ca-app-pub-3940256099942544~3347511713'
            ]
            buildConfigField 'String', 'ADMOB_BANNER_ID', '"ca-app-pub-3940256099942544/6300978111"'
            buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID', '"ca-app-pub-3940256099942544/1033173712"'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            def releaseAppId = project.findProperty('ADMOB_APP_ID') ?: 'ca-app-pub-3940256099942544~3347511713'
            def releaseBannerId = project.findProperty('ADMOB_BANNER_ID') ?: 'ca-app-pub-3940256099942544/6300978111'
            def releaseInterstitialId = project.findProperty('ADMOB_INTERSTITIAL_ID') ?: 'ca-app-pub-3940256099942544/1033173712'
            manifestPlaceholders = [
                    admobAppId: releaseAppId
            ]
            buildConfigField 'String', 'ADMOB_BANNER_ID', "\"${releaseBannerId}\""
            buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID', "\"${releaseInterstitialId}\""
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/rxjava.properties']
        }
    }
}

dependencies {
    implementation project(':core')
    implementation project(':rxjava')
    implementation project(':rxjava2')

    implementation rootProject.ext.appCompat
    implementation rootProject.ext.coreKtx
    implementation rootProject.ext.materialDesign
    implementation rootProject.ext.constraintLayout
    implementation rootProject.ext.biometric
    implementation rootProject.ext.playServicesAds
}

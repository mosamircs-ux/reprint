buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
    }
}

subprojects {
    version = VERSION_NAME
    group = GROUP

    repositories {
        google()
        mavenCentral()
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

ext {
    minSdkVersion = 23
    compileSdkVersion = 36
    targetSdkVersion = 36

    // library dependencies
    appCompat = 'androidx.appcompat:appcompat:1.7.0'
    coreKtx = 'androidx.core:core:1.15.0'
    rxjava1 = 'io.reactivex:rxjava:1.3.8'
    rxjava2 = 'io.reactivex.rxjava2:rxjava:2.2.21'

    // app dependencies
    materialDesign = 'com.google.android.material:material:1.12.0'
    constraintLayout = 'androidx.constraintlayout:constraintlayout:2.2.0'
    biometric = 'androidx.biometric:biometric:1.1.0'
    playServicesAds = 'com.google.android.gms:play-services-ads:23.6.0'

    // test dependencies
    junit = 'junit:junit:4.13.2'
    assertj = 'org.assertj:assertj-core:3.24.2'
    robolectric = 'org.robolectric:robolectric:4.12.2'
    mockito = 'org.mockito:mockito-core:5.11.0'
}
